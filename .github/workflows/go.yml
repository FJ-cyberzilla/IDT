name: CI

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'    # reads version from go.mod, no drift
          cache: true                   # caches module downloads

      - name: Verify formatting
        run: |
          if [ "$(gofmt -l . | wc -l)" -gt 0 ]; then
            echo "The following files are not gofmt'd:"
            gofmt -l .
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Build Binary and Verify Checksum
        run: |
          mkdir -p bin
          go build -o bin/idt main.go
          sha256sum bin/idt > bin/idt.sha256
          sha256sum -c bin/idt.sha256
          echo "Binary integrity verified successfully!"

      - name: Test (offline — no network calls)
        run: go test -short -v ./...
